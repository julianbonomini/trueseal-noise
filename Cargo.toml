[package]
name = "trueseal-noise"
version = "0.1.0"
edition = "2021"
description = "Noise Protocol Framework — Noise_XX_25519_ChaChaPoly_BLAKE2s and Noise_NK_25519_ChaChaPoly_BLAKE2s"
license = "Apache-2.0"
publish = false  # not published until open-sourced

[lib]
crate-type = ["cdylib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi_bindgen.rs"

[dependencies]
x25519-dalek = { version = "2", features = ["static_secrets"] }
snow = "0.10"
rand = "0.8"
uniffi = { version = "0.28", features = ["build", "cli"] }
thiserror = "1"
zeroize = { version = "1", features = ["derive"] }

[lints.clippy]
# UniFFI-generated scaffolding triggers this; not our code.
empty_line_after_doc_comments = "allow"

[build-dependencies]
uniffi = { version = "0.28", features = ["build"] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
